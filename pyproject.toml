[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "structiq"
version = "0.1.0"
description = "AI-powered structural engineering assistant"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "sympy",
    "pydantic>=2",
    "pint",
    "pyyaml",
    "ezdxf",
    "pymupdf",
    "python-docx",  # calculation reports and specifications (qaqc)
    "openpyxl",  # calculation workbooks (qaqc)
    "pillow",
    "matplotlib",  # previews of templates and layouts, report figures
    "shapely",  # geometry for PT layout checks
]

[project.optional-dependencies]
dev = ["pytest", "mypy", "ruff", "types-PyYAML"]
mcp = ["mcp"]  # optional read-only MCP server (structiq.tools.mcp)

[tool.hatch.build.targets.wheel]
packages = ["src/structiq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_soffice: needs LibreOffice (PDF export, XLSX recalculation); skipped when it is not found",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E402", "E702", "E731", "UP031", "UP042", "E741", "E501"]  # style of the ported SDSA code; tidy later

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["structiq.core.*"]
strict = true

[[tool.mypy.overrides]]
module = ["structiq.core.design_basis"]  # ported script, not yet typed
ignore_errors = true

[[tool.mypy.overrides]]
module = ["structiq.tools.etabs.*", "structiq.tools.mcp.server"]  # ported, not yet typed (mcp has two API generations)
ignore_errors = true
